name: CI

on:
  push:
    branches: [main, 'fix/**']
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 安装依赖
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: 语法与模块检查
        run: node scripts/verify.mjs

      - name: 平台层自检
        run: node --input-type=module -e "import p from './src/platform.js'; console.log(JSON.stringify(p.summary()))"

      - name: CLI 可用性（list）
        run: node src/index.js list

      - name: 定时设置读取（不写入）
        run: node src/index.js schedule

      - name: 生成配置（幂等）
        run: node src/index.js list

      - name: 无账号回归测试（禁止真实签到或客户端重启）
        run: npm test
